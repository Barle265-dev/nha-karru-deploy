services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/barle265-dev/nha-karru-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env

  migrate:
    image: ghcr.io/barle265-dev/nha-karru-backend:latest
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    command: node ace migration:run --force

  frontend:
    image: ghcr.io/barle265-dev/nha-karru-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  pgdata:
